name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install and build
        run: |
          mkdir -p www
          cp -r index.html images bgm.mp3 se_click.mp3 se_button.mp3 www/ 2>/dev/null || true
          cp title.html www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BentoBattle" "com.habit.bentobattle" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2g" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
